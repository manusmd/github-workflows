name: Build and deploy a portfolio app

# Reusable workflow: called from a project repo's own workflow, e.g.
#
#   jobs:
#     build-and-deploy:
#       permissions:
#         contents: write
#         packages: write
#       uses: manusmd/github-workflows/.github/workflows/build-and-deploy.yml@main
#       with:
#         app-name: my-app
#
# Builds the calling repo's Dockerfile and pushes it to
# ghcr.io/<owner>/<app-name>:<git-sha> (full SHA, so it matches exactly
# what an ApplicationSet pullRequest generator's {{.head_sha}} produces for
# PR previews).
#
# On a push (e.g. to main): also bumps image.tag in this same repo's own
# chart/values.yaml and commits it -- ArgoCD (watching this repo directly,
# see examples/app-application.yaml) picks it up from there. No token to
# any other repo is needed for this.
#
# On a pull_request: only builds/pushes the image. The PR preview
# environment itself is created by an ApplicationSet with a pullRequest
# generator (see examples/pr-preview-applicationset.yaml) which injects the
# matching image tag directly via a templated Helm parameter -- nothing for
# this workflow to commit.

on:
  workflow_call:
    inputs:
      app-name:
        description: Used for the GHCR image name (ghcr.io/<owner>/<app-name>)
        required: true
        type: string
      context:
        description: Docker build context, relative to the calling repo
        required: false
        type: string
        default: "."
      dockerfile:
        description: Path to the Dockerfile, relative to the build context
        required: false
        type: string
        default: "Dockerfile"
      chart-values-path:
        description: Path to the chart's values.yaml within this repo
        required: false
        type: string
        default: "chart/values.yaml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ inputs.app-name }}:${{ steps.sha.outputs.sha }}

      - name: Bump image tag and commit
        if: github.event_name == 'push'
        uses: mikefarah/yq@v4
        with:
          cmd: yq eval -i '.image.tag = "${{ steps.sha.outputs.sha }}"' ${{ inputs.chart-values-path }}

      - name: Commit and push
        if: github.event_name == 'push'
        # A calling repo can have more than one of these reusable workflows on the same push (e.g. one
        # per app, each with its own path filter) -- when a single commit touches more than one app's
        # paths, they all fire together, build/push in parallel, and then race to commit+push their own
        # chart bump back onto the same branch. Whichever finishes first wins outright; every other one
        # hits a non-fast-forward rejection since its checkout is pinned to the original triggering
        # commit regardless of how long its own build took. Retrying with a rebase (the working tree is
        # clean at this point -- the only local change is our own bump commit -- so this is just
        # replaying that one commit onto whatever else landed) resolves it without needing the workflows
        # to coordinate or run sequentially.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ inputs.chart-values-path }}
          git commit -m "Deploy ${{ inputs.app-name }}@${{ steps.sha.outputs.sha }}" || exit 0

          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) -- another workflow likely pushed first. Rebasing onto the latest remote branch and retrying..."
            git pull --rebase || { echo "::error::Rebase failed while retrying the chart-bump push"; exit 1; }
          done

          echo "::error::Failed to push the chart bump after 5 attempts"
          exit 1
